[project]
name = "digikey-mcp"
version = "0.3.0"
description = "Model Context Protocol server for DigiKey's Product Search v4 API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tim Beck" }]
keywords = ["mcp", "digikey", "electronics", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.14,<3",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.scripts]
digikey-mcp = "digikey_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tmbeck/mcp-digikey"
Issues = "https://github.com/tmbeck/mcp-digikey/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digikey_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    ".env.example",
    ".mcp.json.example",
]
# Keep dev-only material out of the published source distribution.
exclude = [
    "useful_llm_context/",
    ".claude/",
    "CLAUDE.md",
    "dist/",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
