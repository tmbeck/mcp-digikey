[project]
name = "digikey-mcp"
version = "0.2.0"
description = "Model Context Protocol server for DigiKey's Product Search v4 API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tim Beck" }]
keywords = ["mcp", "digikey", "electronics", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
digikey-mcp = "digikey_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tmbeck/mcp-digikey"
Issues = "https://github.com/tmbeck/mcp-digikey/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digikey_mcp"]
